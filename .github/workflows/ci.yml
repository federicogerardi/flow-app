name: CI

on:
  pull_request:
    branches: [main, staging, dev]
    paths-ignore:
      - 'Wiki/**'
      - '**.md'
      - '.obsidian/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_ci-checks.yml