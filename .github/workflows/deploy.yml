name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, production]
        default: dev
  push:
    branches: [main, staging, dev]
    paths-ignore:
      - 'Wiki/**'
      - '**.md'
      - '.obsidian/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_ci-checks.yml

  deploy-dev:
    name: Deploy (dev)
    if: github.ref == 'refs/heads/dev'
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://github.com/railwayapp/cli/releases/download/v3.21.0/railway-v3.21.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/railway.tar.gz
          tar xzf /tmp/railway.tar.gz -C /tmp
          chmod +x /tmp/railway
          echo /tmp >> "$GITHUB_PATH"
      - name: Deploy to Railway
        run: railway up --ci --environment dev --project "$RAILWAY_PROJECT_ID" --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  deploy-staging:
    name: Deploy (staging)
    if: github.ref == 'refs/heads/staging'
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://github.com/railwayapp/cli/releases/download/v3.21.0/railway-v3.21.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/railway.tar.gz
          tar xzf /tmp/railway.tar.gz -C /tmp
          chmod +x /tmp/railway
          echo /tmp >> "$GITHUB_PATH"
      - name: Deploy to Railway
        run: railway up --ci --environment staging --project "$RAILWAY_PROJECT_ID" --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  deploy-production:
    name: Deploy (production)
    if: github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://github.com/railwayapp/cli/releases/download/v3.21.0/railway-v3.21.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/railway.tar.gz
          tar xzf /tmp/railway.tar.gz -C /tmp
          chmod +x /tmp/railway
          echo /tmp >> "$GITHUB_PATH"
      - name: Deploy to Railway
        run: railway up --ci --environment production --project "$RAILWAY_PROJECT_ID" --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}